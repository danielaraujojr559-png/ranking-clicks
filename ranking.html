<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MouseClickCounter — Ranking Global (Windows Aero Edition)</title>
<style>
/* ============================================================
   FRUTIGER AERO / WINDOWS 7 AERO GLASS — RANKING GLOBAL
   Estética: 2006-2011 · Vista · Win7 · MSN Messenger
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── VARIÁVEIS ─────────────────────────────────────────────── */
:root {
  --sky-top:      #0055c8;
  --sky-mid:      #38b6ff;
  --sky-low:      #b5f2ff;
  --grass-top:    #7ed957;
  --grass-bot:    #28a745;
  --aero-bg:      rgba(220,240,255,0.45);
  --aero-border1: rgba(255,255,255,0.80);
  --aero-border2: rgba(0,60,110,0.60);
  --glass-shine:  linear-gradient(135deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.05) 45%,transparent 45.1%);
  --gold:   #f5c518;
  --silver: #c0c0c0;
  --bronze: #cd7f32;
  --font:   'Segoe UI','Trebuchet MS','Tahoma',sans-serif;
}

/* ── CORPO / CENÁRIO ECO-FUTURISMO ─────────────────────────── */
html, body {
  min-height: 100vh;
  font-family: var(--font);
  overflow-x: hidden;
}

body {
  background:
    linear-gradient(
      to bottom,
      var(--sky-top)  0%,
      var(--sky-mid)  40%,
      var(--sky-low)  68%,
      var(--grass-top) 70%,
      var(--grass-bot) 100%
    );
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 28px 12px 40px;
  position: relative;
}

/* ── AURORA DE FEIXES DIAGONAIS (SVG inline / CSS) ─────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    /* Feixes de luz diagonais translúcidos */
    linear-gradient(118deg,
      transparent 0%,
      rgba(255,255,255,.07) 15%,
      transparent 16%,
      transparent 30%,
      rgba(255,255,255,.10) 42%,
      transparent 43%,
      transparent 60%,
      rgba(255,255,255,.06) 71%,
      transparent 72%
    );
}

/* ── BOLHAS DE SABÃO FLUTUANTES ─────────────────────────────── */
.bubbles { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }

.bubble {
  position: absolute;
  bottom: -120px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 32% 28%,
    rgba(255,255,255,.80) 0%,
    rgba(160,220,255,.45) 30%,
    rgba(100,180,255,.18) 65%,
    rgba(0,120,220,.08) 100%
  );
  box-shadow:
    inset 0 0 8px rgba(255,255,255,.6),
    0 2px 8px rgba(0,120,220,.18);
  animation: floatUp linear infinite;
  opacity: .75;
}

/* 14 bolhas de tamanhos/posições/durações variadas */
.bubble:nth-child(1)  { width:28px;height:28px; left:5%;   animation-duration:12s; animation-delay:0s; }
.bubble:nth-child(2)  { width:18px;height:18px; left:12%;  animation-duration:9s;  animation-delay:2s; }
.bubble:nth-child(3)  { width:40px;height:40px; left:22%;  animation-duration:15s; animation-delay:1s; }
.bubble:nth-child(4)  { width:14px;height:14px; left:35%;  animation-duration:10s; animation-delay:4s; }
.bubble:nth-child(5)  { width:32px;height:32px; left:48%;  animation-duration:13s; animation-delay:0.5s; }
.bubble:nth-child(6)  { width:22px;height:22px; left:58%;  animation-duration:11s; animation-delay:3s; }
.bubble:nth-child(7)  { width:50px;height:50px; left:68%;  animation-duration:17s; animation-delay:1.5s; }
.bubble:nth-child(8)  { width:16px;height:16px; left:78%;  animation-duration:8s;  animation-delay:5s; }
.bubble:nth-child(9)  { width:36px;height:36px; left:88%;  animation-duration:14s; animation-delay:2.5s; }
.bubble:nth-child(10) { width:24px;height:24px; left:94%;  animation-duration:10s; animation-delay:6s; }
.bubble:nth-child(11) { width:20px;height:20px; left:3%;   animation-duration:16s; animation-delay:7s; }
.bubble:nth-child(12) { width:44px;height:44px; left:43%;  animation-duration:19s; animation-delay:3.5s; }
.bubble:nth-child(13) { width:12px;height:12px; left:72%;  animation-duration:7s;  animation-delay:1s; }
.bubble:nth-child(14) { width:30px;height:30px; left:55%;  animation-duration:12s; animation-delay:8s; }

@keyframes floatUp {
  0%   { transform: translateY(0)   translateX(0) scale(1);    opacity:.75; }
  25%  { transform: translateY(-25vh) translateX(12px)  scale(1.04); }
  50%  { transform: translateY(-50vh) translateX(-8px)  scale(1.08); opacity:.6; }
  75%  { transform: translateY(-75vh) translateX(14px)  scale(1.03); }
  100% { transform: translateY(-105vh) translateX(0)  scale(.95); opacity:0; }
}

/* ── JANELA AERO GLASS PRINCIPAL ───────────────────────────── */
.aero-window {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 860px;
  border-radius: 8px;
  /* Dupla borda Aero */
  border: 1px solid var(--aero-border1);
  outline: 1px solid var(--aero-border2);
  outline-offset: 1px;
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  background: var(--aero-bg);
  box-shadow:
    0  4px 32px rgba(0,60,140,.35),
    0  1px  2px rgba(255,255,255,.60) inset,
    0 -1px  1px rgba(0,60,110,.25) inset;
  overflow: hidden;
}

/* Reflexo de vidro diagonal */
.aero-window::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--glass-shine);
  pointer-events: none;
  z-index: 2;
  border-radius: 8px;
}

/* ── BARRA DE TÍTULO WIN7 ───────────────────────────────────── */
.title-bar {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  padding: 7px 10px 7px 12px;
  background: linear-gradient(
    to bottom,
    rgba(180,220,255,.90) 0%,
    rgba(100,180,255,.75) 55%,
    rgba(60,140,240,.65) 100%
  );
  border-bottom: 1px solid rgba(0,80,160,.40);
  box-shadow: 0 1px 0 rgba(255,255,255,.60) inset;
  gap: 10px;
  user-select: none;
}

/* Ícone orbe verde-azul */
.title-orb {
  width: 22px; height: 22px;
  flex-shrink: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%,
    #ffffff 0%, #72e8ff 25%, #00b4d8 55%, #005f73 100%);
  box-shadow:
    0 0 6px rgba(0,180,220,.8),
    0 1px 3px rgba(0,0,0,.3),
    inset 0 1px 2px rgba(255,255,255,.9);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
}

.title-text {
  flex: 1;
  font-size: 12.5px;
  font-weight: 600;
  color: #fff;
  letter-spacing: .3px;
  text-shadow: 0 0 8px #fff, 0 0 14px #fff, 0 1px 2px rgba(0,40,100,.8);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Botões da janela Win7 */
.win-btns { display:flex; gap:2px; flex-shrink:0; }

.win-btn {
  width: 26px; height: 18px;
  border-radius: 3px;
  border: 1px solid rgba(0,60,110,.55);
  cursor: pointer;
  font-size: 9px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  color: #ffffff;
  text-shadow: 0 1px 1px rgba(0,0,0,.5);
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.55) 0%,
    rgba(255,255,255,.20) 50%,
    rgba(100,170,255,.45) 50.1%,
    rgba(60,130,230,.60) 100%
  );
  box-shadow:
    0 1px 0 rgba(255,255,255,.6) inset,
    0 -1px 0 rgba(0,60,110,.3) inset;
  transition: box-shadow .1s, background .1s;
  user-select: none;
}

.win-btn:hover {
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.75) 0%,
    rgba(255,255,255,.35) 50%,
    rgba(120,200,255,.60) 50.1%,
    rgba(0,120,255,.80) 100%
  );
  box-shadow: 0 0 8px rgba(0,180,255,.7), 0 1px 0 rgba(255,255,255,.7) inset;
}

.win-btn.close-btn {
  background: linear-gradient(
    to bottom,
    rgba(255,200,190,.80) 0%,
    rgba(255,120,100,.50) 50%,
    rgba(220,50,30,.70) 50.1%,
    rgba(160,20,10,.85) 100%
  );
  width: 38px;
}

.win-btn.close-btn:hover {
  background: linear-gradient(
    to bottom,
    rgba(255,220,210,1) 0%,
    rgba(255,150,130,.80) 50%,
    rgba(255,70,50,.95) 50.1%,
    rgba(190,30,10,1) 100%
  );
  box-shadow: 0 0 12px rgba(255,60,30,.9), 0 1px 0 rgba(255,200,190,.7) inset;
}

/* ── TABS (HOJE / TOTAL) ────────────────────────────────────── */
.tab-bar {
  position: relative;
  z-index: 4;
  display: flex;
  gap: 6px;
  padding: 10px 16px 0;
  background: rgba(200,230,255,.30);
  border-bottom: 1px solid rgba(0,80,160,.30);
}

.tab-btn {
  padding: 6px 22px;
  border-radius: 6px 6px 0 0;
  border: 1px solid rgba(0,80,160,.50);
  border-bottom: none;
  cursor: pointer;
  font-family: var(--font);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .2px;
  color: #003875;
  /* GEL PILL — corte 50/50 */
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.75) 0%,
    rgba(255,255,255,.20) 50%,
    rgba(60,160,255,.55) 50.1%,
    rgba(0,100,230,.70) 100%
  );
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 -1px 0 rgba(0,60,140,.25) inset;
  transition: box-shadow .15s, filter .15s;
}

.tab-btn:hover {
  box-shadow: 0 0 12px rgba(0,210,255,.9), 0 1px 0 rgba(255,255,255,.8) inset;
  filter: brightness(1.12);
}

.tab-btn.active {
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.90) 0%,
    rgba(255,255,255,.50) 50%,
    rgba(130,200,255,.70) 50.1%,
    rgba(60,150,255,.85) 100%
  );
  color: #001f5c;
  box-shadow: 0 0 10px rgba(0,180,255,.6), 0 2px 0 rgba(255,255,255,.9) inset;
}

/* ── CONTEÚDO / ÁREA INTERNA ───────────────────────────────── */
.aero-content {
  position: relative;
  z-index: 3;
  background: rgba(255,255,255,.88);
  border: 1px solid rgba(0,80,160,.18);
  box-shadow: inset 0 2px 6px rgba(0,60,140,.12), inset 0 -1px 3px rgba(0,60,140,.08);
  margin: 0 8px;
  border-radius: 0 0 4px 4px;
  overflow: hidden;
}

/* ── BOTÃO ATUALIZAR ────────────────────────────────────────── */
.refresh-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px 8px;
  background: linear-gradient(to bottom,rgba(220,235,255,.60),rgba(200,225,255,.40));
  border-bottom: 1px solid rgba(0,80,160,.15);
}

.refresh-btn {
  padding: 5px 18px;
  border-radius: 14px;
  border: 1px solid rgba(0,80,160,.60);
  cursor: pointer;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.45);
  /* GEL PILL verde-lima */
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.75) 0%,
    rgba(255,255,255,.20) 50%,
    rgba(50,200,80,.75) 50.1%,
    rgba(20,140,40,.85) 100%
  );
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 2px 6px rgba(0,0,0,.20);
  transition: box-shadow .15s, filter .15s;
}

.refresh-btn:hover {
  box-shadow: 0 0 12px rgba(0,210,100,.9), 0 1px 0 rgba(255,255,255,.7) inset;
  filter: brightness(1.1);
}

.refresh-btn:active { transform: scale(.97); }

.next-refresh-label {
  font-size: 11px;
  color: #334;
  opacity: .75;
}

/* ── PÓDIO TOP 3 ─────────────────────────────────────────────── */
.podium-row {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 14px;
  padding: 18px 12px 12px;
  background: linear-gradient(to bottom, rgba(220,240,255,.50), rgba(200,225,255,.20));
  border-bottom: 1px solid rgba(0,80,160,.14);
}

.podium-card {
  flex: 1;
  max-width: 240px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.70);
  text-align: center;
  padding: 10px 8px 12px;
  position: relative;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 16px rgba(0,0,0,.15), 0 1px 0 rgba(255,255,255,.8) inset;
}

/* Orbes 3D do pódio */
.podium-orb {
  width: 52px; height: 52px;
  border-radius: 50%;
  margin: 0 auto 8px;
  box-shadow: 0 4px 14px rgba(0,0,0,.3), inset 0 2px 6px rgba(255,255,255,.55);
}

.orb-gold {
  background: radial-gradient(circle at 33% 28%,
    #fff8d0 0%, #f5c518 35%, #d4a017 65%, #7a5800 100%);
  box-shadow: 0 4px 16px rgba(212,160,23,.7), inset 0 2px 6px rgba(255,255,200,.7);
}

.orb-silver {
  background: radial-gradient(circle at 33% 28%,
    #ffffff 0%, #e8e8e8 30%, #b0b0b0 60%, #505050 100%);
  box-shadow: 0 4px 16px rgba(150,150,150,.6), inset 0 2px 6px rgba(255,255,255,.8);
}

.orb-bronze {
  background: radial-gradient(circle at 33% 28%,
    #fff0d8 0%, #cd9156 30%, #9e5c28 60%, #4a2000 100%);
  box-shadow: 0 4px 16px rgba(160,100,40,.6), inset 0 2px 6px rgba(255,220,160,.6);
}

.podium-card.rank1 {
  background: linear-gradient(135deg,rgba(255,245,160,.60),rgba(255,220,60,.25));
  transform: translateY(-12px);
}
.podium-card.rank2 {
  background: linear-gradient(135deg,rgba(220,230,255,.60),rgba(160,180,220,.25));
}
.podium-card.rank3 {
  background: linear-gradient(135deg,rgba(240,220,190,.60),rgba(200,160,100,.25));
}

.podium-rank-badge {
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
}
.rank1 .podium-rank-badge { color:#d4a017; text-shadow: 0 0 10px rgba(255,220,0,.9); }
.rank2 .podium-rank-badge { color:#909090; text-shadow: 0 0 8px rgba(200,200,200,.8); }
.rank3 .podium-rank-badge { color:#9e5c28; text-shadow: 0 0 8px rgba(180,120,60,.8); }

.podium-name {
  font-size: 13px;
  font-weight: 700;
  color: #002060;
  margin: 4px 0 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.podium-clicks {
  font-size: 11px;
  color: #334;
  margin-bottom: 6px;
}

/* Barra de progresso Vista (verde brilhante animada) */
.vista-progress-track {
  height: 12px;
  border-radius: 6px;
  background: rgba(0,0,0,.12);
  border: 1px solid rgba(0,0,0,.18);
  overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.20);
}

.vista-progress-bar {
  height: 100%;
  border-radius: 6px;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.80) 0%,
    rgba(130,255,100,.85) 50%,
    rgba(30,180,30,.95) 50.1%,
    rgba(10,120,10,1) 100%
  );
  box-shadow: 0 0 8px rgba(30,200,30,.7);
  position: relative;
  transition: width .8s cubic-bezier(.25,.8,.25,1);
}

/* Brilho deslizante da progress bar */
.vista-progress-bar::after {
  content: '';
  position: absolute;
  top: 0; left: -60%;
  width: 40%;
  height: 100%;
  background: linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation: progressShine 2.2s linear infinite;
}

@keyframes progressShine {
  0%   { left:-60%; }
  100% { left:120%; }
}

/* ── TABELA PRINCIPAL ────────────────────────────────────────── */
.ranking-table-wrap {
  padding: 6px 10px 14px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 2px;
  font-size: 12.5px;
}

thead tr th {
  padding: 7px 10px;
  text-align: left;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: .4px;
  text-transform: uppercase;
  color: #003875;
  background: linear-gradient(
    to bottom,
    rgba(200,225,255,.90) 0%,
    rgba(160,200,255,.75) 100%
  );
  border-top: 1px solid rgba(0,80,160,.25);
  border-bottom: 2px solid rgba(0,80,160,.35);
}

thead tr th:first-child { border-radius: 4px 0 0 0; }
thead tr th:last-child  { border-radius: 0 4px 0 0; }

tbody tr {
  cursor: default;
  transition: background .12s, box-shadow .12s;
}

tbody tr td {
  padding: 7px 10px;
  border-bottom: 1px solid rgba(0,80,160,.09);
  color: #1a2a3a;
  vertical-align: middle;
}

tbody tr:hover td {
  background: linear-gradient(
    to bottom,
    rgba(200,235,255,.70) 0%,
    rgba(160,210,255,.45) 50%,
    rgba(100,180,255,.35) 50.1%,
    rgba(60,150,255,.25) 100%
  );
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,80,160,.18);
}

tbody tr:nth-child(even) td { background: rgba(230,242,255,.45); }
tbody tr:nth-child(even):hover td {
  background: linear-gradient(
    to bottom,
    rgba(200,235,255,.75) 0%,
    rgba(160,210,255,.50) 50%,
    rgba(100,180,255,.40) 50.1%,
    rgba(60,150,255,.30) 100%
  );
}

/* Medalha de posição */
.rank-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  border-radius: 50%;
  font-weight: 700;
  font-size: 11px;
  color: #fff;
  background: linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.15) 50%,rgba(40,100,200,.70) 50.1%,rgba(0,60,180,1) 100%);
  box-shadow: 0 1px 4px rgba(0,40,120,.4), inset 0 1px 2px rgba(255,255,255,.55);
}

.rank-badge.gold   { background:linear-gradient(135deg,#fffae0 0%,#f5d060 50%,#c8920a 50.1%,#9a6e00 100%); color:#3a2000; }
.rank-badge.silver { background:linear-gradient(135deg,#ffffff 0%,#d8d8d8 50%,#909090 50.1%,#606060 100%); color:#202020; }
.rank-badge.bronze { background:linear-gradient(135deg,#fff0d8 0%,#d4a060 50%,#9e5c28 50.1%,#6a3000 100%); color:#fff; }

/* Contador LCD vitrificado */
.lcd-count {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 5px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #003030;
  background: linear-gradient(
    to bottom,
    rgba(180,255,220,.80) 0%,
    rgba(180,255,220,.60) 45%,
    rgba(40,180,80,.60) 50%,
    rgba(20,130,50,.70) 100%
  );
  border: 1px solid rgba(0,120,40,.40);
  box-shadow:
    inset 0 1px 3px rgba(255,255,255,.50),
    inset 0 -1px 2px rgba(0,80,30,.25),
    0 1px 4px rgba(0,0,0,.15);
}

/* ── STATUS BAR CLÁSSICA ─────────────────────────────────────── */
.status-bar {
  position: relative;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 0;
  padding: 4px 10px;
  background: linear-gradient(
    to bottom,
    rgba(200,215,235,.85) 0%,
    rgba(170,190,220,.80) 100%
  );
  border-top: 1px solid rgba(0,60,110,.30);
  box-shadow: 0 -1px 0 rgba(255,255,255,.50) inset;
  font-size: 11px;
  color: #223;
  flex-wrap: wrap;
}

.status-segment {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 12px;
  border-right: 1px solid rgba(0,60,110,.25);
}

.status-segment:first-child { padding-left: 4px; }
.status-segment:last-child  { border-right: none; }

/* Orbe de status verde a piscar */
.status-orb {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #afffb0, #22dd44, #006620);
  box-shadow: 0 0 5px #22ff44;
  animation: orbPulse 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes orbPulse {
  0%,100% { box-shadow: 0 0 4px #22ff44, 0 0 8px rgba(34,255,68,.5); opacity:1; }
  50%      { box-shadow: 0 0 8px #22ff44, 0 0 16px rgba(34,255,68,.8); opacity:.7; }
}

/* ── TAB PANELS ──────────────────────────────────────────────── */
.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* ── EMPTY STATE ─────────────────────────────────────────────── */
.empty-msg {
  text-align: center;
  padding: 30px 20px;
  color: #667;
  font-size: 13px;
  font-style: italic;
}

/* ── LOADING SPINNER ─────────────────────────────────────────── */
.loading-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 30px 20px;
  color: #334;
  font-size: 13px;
}

.vista-spinner {
  width: 28px; height: 28px;
  border: 3px solid rgba(0,120,220,.20);
  border-top-color: rgba(0,120,220,.90);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── TOOLTIP DA UPDATED_AT ───────────────────────────────────── */
.player-name { font-weight: 600; color: #002060; }

/* ── RESPONSIVO ──────────────────────────────────────────────── */
@media (max-width: 600px) {
  .podium-row { flex-direction: column; align-items: center; }
  .podium-card { max-width: 90%; transform: none !important; }
  .title-text { font-size: 10.5px; }
  .lcd-count { font-size: 10px; padding: 2px 6px; }
}
</style>
</head>
<body>

<!-- Bolhas de sabão flutuantes -->
<div class="bubbles">
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="bubble"></div><div class="bubble"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     JANELA AERO GLASS
     ═══════════════════════════════════════════════════════════ -->
<div class="aero-window">

  <!-- Barra de Título Win7 -->
  <div class="title-bar">
    <div class="title-orb">🖱️</div>
    <div class="title-text">MouseClickCounter — Ranking Global &nbsp;·&nbsp; Windows Aero Edition</div>
    <div class="win-btns">
      <div class="win-btn" title="Minimizar">&#x2014;</div>
      <div class="win-btn" title="Maximizar">&#x25A1;</div>
      <div class="win-btn close-btn" title="Fechar">&#x2715;</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-today"   onclick="switchTab('today')">🖱️ Cliques de Hoje</button>
    <button class="tab-btn"        id="tab-total"   onclick="switchTab('total')">🔥 Total Geral</button>
  </div>

  <!-- Conteúdo interno -->
  <div class="aero-content">

    <!-- Linha do botão Atualizar -->
    <div class="refresh-row">
      <button class="refresh-btn" onclick="loadRanking()">⟳ Atualizar Agora</button>
      <span class="next-refresh-label" id="next-refresh-lbl">Próxima atualização em 30s…</span>
    </div>

    <!-- Estado de carregamento -->
    <div id="loading-state" class="loading-wrap">
      <div class="vista-spinner"></div>
      A carregar ranking…
    </div>

    <!-- ─ TAB: HOJE ─ -->
    <div class="tab-panel active" id="panel-today">
      <!-- Pódio -->
      <div class="podium-row" id="podium-today"></div>
      <!-- Tabela -->
      <div class="ranking-table-wrap">
        <table id="table-today">
          <thead><tr>
            <th style="width:44px">#</th>
            <th>Jogador</th>
            <th>Cliques Hoje</th>
            <th>Total Histórico</th>
            <th>Atualizado</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- ─ TAB: TOTAL ─ -->
    <div class="tab-panel" id="panel-total">
      <div class="podium-row" id="podium-total"></div>
      <div class="ranking-table-wrap">
        <table id="table-total">
          <thead><tr>
            <th style="width:44px">#</th>
            <th>Jogador</th>
            <th>Total Histórico</th>
            <th>Cliques Hoje</th>
            <th>Atualizado</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div><!-- /aero-content -->

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-segment">
      <div class="status-orb"></div>
      <span>Servidor Turso Online</span>
    </div>
    <div class="status-segment" id="sb-players">👥 Jogadores: —</div>
    <div class="status-segment" id="sb-total-clicks">🖱️ Cliques totais: —</div>
    <div class="status-segment" id="sb-refresh">🔄 Próx. atualização: 30s</div>
  </div>

</div><!-- /aero-window -->

<script>
/* ============================================================
   JAVASCRIPT — Ranking Logic
   ============================================================ */

let currentTab     = 'today';
let rankingData    = { top_today: [], top_total: [] };
let countdown      = 30;
let countdownTimer = null;

/* ── Troca de aba ─────────────────────────────────────────── */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'   + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

/* ── Formata número com separador de milhar ───────────────── */
function fmtNum(n) {
  return Number(n).toLocaleString('pt-BR');
}

/* ── Orbe de pódio ────────────────────────────────────────── */
function orbClass(pos) {
  return pos === 0 ? 'orb-gold' : pos === 1 ? 'orb-silver' : 'orb-bronze';
}
function cardClass(pos) {
  return pos === 0 ? 'rank1' : pos === 1 ? 'rank2' : 'rank3';
}
function badgeClass(pos) {
  return pos === 0 ? 'gold' : pos === 1 ? 'silver' : 'bronze';
}
function medalEmoji(pos) {
  return ['🥇','🥈','🥉'][pos] || (pos + 1);
}

/* ── Constrói pódio top-3 ─────────────────────────────────── */
function buildPodium(containerId, rows, mainKey, secKey) {
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  if (!rows || rows.length === 0) { wrap.innerHTML = '<div class="empty-msg">Ainda sem dados para exibir.</div>'; return; }

  const top3 = rows.slice(0, 3);
  const maxVal = Number(top3[0][mainKey]) || 1;

  top3.forEach((row, i) => {
    const pct = Math.max(6, Math.round((Number(row[mainKey]) / maxVal) * 100));
    const card = document.createElement('div');
    card.className = `podium-card ${cardClass(i)}`;
    card.innerHTML = `
      <div class="podium-orb ${orbClass(i)}"></div>
      <div class="podium-rank-badge">${medalEmoji(i)}</div>
      <div class="podium-name" title="${esc(row.nickname)}">${esc(row.nickname)}</div>
      <div class="podium-clicks">🖱️ ${fmtNum(row[mainKey])} cliques</div>
      <div class="vista-progress-track">
        <div class="vista-progress-bar" style="width:${pct}%"></div>
      </div>`;
    wrap.appendChild(card);
  });
}

/* ── Constrói tabela ──────────────────────────────────────── */
function buildTable(tableId, rows, mainKey, secKey) {
  const tbody = document.querySelector(`#${tableId} tbody`);
  tbody.innerHTML = '';
  if (!rows || rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">Nenhum jogador encontrado.</td></tr>';
    return;
  }
  rows.forEach((row, i) => {
    const tr = document.createElement('tr');
    const pos = i;
    const badge = pos < 3
      ? `<span class="rank-badge ${badgeClass(pos)}">${medalEmoji(pos)}</span>`
      : `<span class="rank-badge">${i + 1}</span>`;
    tr.innerHTML = `
      <td style="text-align:center">${badge}</td>
      <td class="player-name">${esc(row.nickname)}</td>
      <td><span class="lcd-count">${fmtNum(row[mainKey])}</span></td>
      <td><span class="lcd-count" style="background:linear-gradient(to bottom,rgba(200,220,255,.80) 0%,rgba(200,220,255,.50) 45%,rgba(80,120,220,.50) 50%,rgba(40,80,200,.60) 100%);color:#001060">${fmtNum(row[secKey])}</span></td>
      <td style="font-size:11px;color:#445;white-space:nowrap">${esc(row.updated_at)}</td>`;
    tbody.appendChild(tr);
  });
}

/* ── Escapa HTML ──────────────────────────────────────────── */
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ── Atualiza Status Bar ──────────────────────────────────── */
function updateStatusBar(data) {
  const allRows = data.top_total || [];
  const totalPlayers = allRows.length;
  const totalClicks  = allRows.reduce((s, r) => s + Number(r.clicks_totais), 0);
  document.getElementById('sb-players').textContent       = `👥 Jogadores: ${totalPlayers}`;
  document.getElementById('sb-total-clicks').textContent  = `🖱️ Cliques globais: ${fmtNum(totalClicks)}`;
}

/* ── Carrega dados da API ─────────────────────────────────── */
async function loadRanking() {
  resetCountdown();
  document.getElementById('loading-state').style.display = 'flex';
  try {
    const res  = await fetch('/api/ranking');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    rankingData = data;

    buildPodium('podium-today', data.top_today, 'clicks_hoje',   'clicks_totais');
    buildTable ('table-today',  data.top_today, 'clicks_hoje',   'clicks_totais');
    buildPodium('podium-total', data.top_total, 'clicks_totais', 'clicks_hoje');
    buildTable ('table-total',  data.top_total, 'clicks_totais', 'clicks_hoje');
    updateStatusBar(data);

  } catch(err) {
    document.querySelector('#table-today tbody').innerHTML =
      `<tr><td colspan="5" class="empty-msg" style="color:#a00">Erro ao carregar: ${err.message}</td></tr>`;
  } finally {
    document.getElementById('loading-state').style.display = 'none';
  }
}

/* ── Contador regressivo ──────────────────────────────────── */
function resetCountdown() {
  countdown = 30;
  updateCountdownUI();
}

function updateCountdownUI() {
  const txt = `🔄 Próx. atualização: ${countdown}s`;
  document.getElementById('sb-refresh').textContent = txt;
  document.getElementById('next-refresh-lbl').textContent = `Próxima atualização em ${countdown}s…`;
}

function tickCountdown() {
  countdown--;
  if (countdown <= 0) {
    loadRanking();
  } else {
    updateCountdownUI();
  }
}

/* ── Init ─────────────────────────────────────────────────── */
loadRanking();
setInterval(tickCountdown, 1000);
</script>
</body>
</html>
